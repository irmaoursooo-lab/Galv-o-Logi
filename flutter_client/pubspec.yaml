name: galvao_logi
description: "Plataforma colaborativa e inteligente para roteirização de cargas com arquitetura offline-first e design industrial Apple."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_tts: ^3.8.5
  latlong2: ^0.9.0
  flutter_map: ^6.1.0
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  vibration: ^1.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
